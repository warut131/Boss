<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(fonts/prompt500.ttf);font-weight:500}
@font-face{font-family:P;src:url(fonts/prompt700.ttf);font-weight:700}
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#000;font-family:P}
#stage{position:absolute;inset:0}
#sub{position:absolute;left:40px;right:40px;top:790px;text-align:center;font-weight:700;font-size:46px;line-height:1.35}
#sub span{display:inline-block;padding:2px 16px 6px;border-radius:10px}
.n{color:#fff;text-shadow:0 0 6px #000,0 3px 0 #000,0 -2px 0 #000,3px 0 0 #000,-3px 0 0 #000}
.y{color:#ffd23f;text-shadow:0 0 6px #000,0 3px 0 #000,0 -2px 0 #000,3px 0 0 #000,-3px 0 0 #000}
.r,.w{color:#fff;background:#d7263d;box-shadow:0 4px 0 #7a1020}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
</style></head>
<body>
<svg id="stage" width="720" height="1280" viewBox="0 0 720 1280"></svg>
<div id="sub"></div>
<div id="end"></div>
<script>
const CHANNEL = 'หลอนก่อนนอน';
let TL = null;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const ease=p=>{p=clamp(p);return p*p*(3-2*p)};
const seg=(p,a,b)=>ease((p-a)/(b-a));

const PAL={skin:'#e9c3a0',hair:'#1d1d24',top:'#2f4271',pants:'#5d6373',shoe:'#22232b',lip:'#b5503f'};
const SH_NIGHT='rgba(6,8,22,0.82)', SH_DAY='rgba(22,28,52,0.84)';

// ---------- character ----------
function face(kind, sil){
  const W='#fff', D='#1b1b22';
  if(kind==='calm') return `<ellipse cx="-20" cy="-475" rx="9" ry="7" fill="${W}"/><ellipse cx="20" cy="-475" rx="9" ry="7" fill="${W}"/>
    <circle cx="-19" cy="-475" r="4.5" fill="${D}"/><circle cx="21" cy="-475" r="4.5" fill="${D}"/>
    <path d="M-32,-492 l22,-2 M10,-494 l22,2" stroke="${D}" stroke-width="5" stroke-linecap="round"/>
    <path d="M-12,-440 q12,4 24,0" stroke="${D}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  if(kind==='closed') return `<path d="M-30,-474 q10,7 20,0 M10,-474 q10,7 20,0" stroke="${D}" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M-32,-490 l22,0 M10,-490 l22,0" stroke="${D}" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="-440" rx="8" ry="6" fill="${D}"/>`;
  if(kind==='scared') return `<ellipse cx="-21" cy="-476" rx="15" ry="16" fill="${W}" stroke="${D}" stroke-width="2"/><ellipse cx="21" cy="-476" rx="15" ry="16" fill="${W}" stroke="${D}" stroke-width="2"/>
    <circle cx="-15" cy="-476" r="3.5" fill="${D}"/><circle cx="27" cy="-476" r="3.5" fill="${D}"/>
    <path d="M-36,-500 q14,-10 26,-4 M10,-504 q14,-6 26,4" stroke="${D}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-436" rx="7" ry="9" fill="${D}"/>`;
  if(kind==='grin') return `<ellipse cx="-21" cy="-478" rx="13" ry="13" fill="${W}"/><ellipse cx="21" cy="-478" rx="13" ry="13" fill="${W}"/>
    <circle cx="-21" cy="-478" r="2.6" fill="${D}"/><circle cx="21" cy="-478" r="2.6" fill="${D}"/>
    <path d="M-36,-496 l24,8 M12,-488 l24,-8" stroke="${D}" stroke-width="5" stroke-linecap="round"/>
    <path d="M-44,-452 Q0,-405 44,-452 Q0,-440 -44,-452Z" fill="${W}" stroke="${PAL.lip}" stroke-width="4"/>
    <path d="M-30,-450 v10 M-18,-447 v16 M-6,-446 v18 M6,-446 v18 M18,-447 v16 M30,-450 v10" stroke="${D}" stroke-width="2"/>`;
  if(kind==='sgrin') return `<ellipse cx="-22" cy="-480" rx="12" ry="9" fill="${W}"/><ellipse cx="22" cy="-480" rx="12" ry="9" fill="${W}"/>
    <path d="M-46,-452 Q0,-400 46,-452 Q0,-438 -46,-452Z" fill="${W}"/>
    <path d="M-32,-450 v10 M-19,-446 v17 M-6,-445 v20 M6,-445 v20 M19,-446 v17 M32,-450 v10" stroke="#05060f" stroke-width="2.5"/>`;
  if(kind==='sscared') return `<ellipse cx="-21" cy="-478" rx="13" ry="15" fill="${W}"/><ellipse cx="21" cy="-478" rx="13" ry="15" fill="${W}"/>
    <circle cx="-21" cy="-474" r="3" fill="#05060f"/><circle cx="21" cy="-474" r="3" fill="#05060f"/>
    <ellipse cx="0" cy="-438" rx="8" ry="11" fill="${W}"/>`;
  return '';
}
function leg(x,a,c){return `<g transform="translate(${x},-205) rotate(${a})"><rect x="-17" y="0" width="34" height="190" rx="12" fill="${c.pants}"/><ellipse cx="4" cy="196" rx="26" ry="13" fill="${c.shoe}"/></g>`}
function arm(x,a,c){return `<g transform="translate(${x},-385) rotate(${a})"><rect x="-15" y="-12" width="30" height="190" rx="15" fill="${c.top}"/><circle cx="0" cy="186" r="18" fill="${c.skin}"/></g>`}
// o: armL, armR (raise deg), walk (phase rad or null), face, sil (colour), faceOp
function fig(o){
  const c=o.sil?{skin:o.sil,hair:o.sil,top:o.sil,pants:o.sil,shoe:o.sil}:PAL;
  const w=o.walk==null?0:Math.sin(o.walk)*22;
  const bob=o.walk==null?0:-Math.abs(Math.cos(o.walk))*8;
  let s=`<g transform="translate(0,${bob})">`;
  s+=leg(-22,w,c)+leg(22,-w,c);
  s+=arm(-80,(o.armL||0)+(o.walk==null?0:-w*0.8),c)+arm(80,-(o.armR||0)+(o.walk==null?0:-w*0.8),c);
  s+=`<rect x="-68" y="-405" width="136" height="215" rx="40" fill="${c.top}"/>`;
  if(!o.sil) s+=`<path d="M-30,-405 L0,-370 L30,-405" stroke="#24345c" stroke-width="6" fill="none"/>`;
  s+=`<rect x="-16" y="-425" width="32" height="30" fill="${c.skin}"/>`;
  s+=`<ellipse cx="-54" cy="-468" rx="9" ry="14" fill="${c.skin}"/><ellipse cx="54" cy="-468" rx="9" ry="14" fill="${c.skin}"/>`;
  s+=`<ellipse cx="0" cy="-468" rx="54" ry="64" fill="${c.skin}"/>`;
  s+=`<path d="M-57,-478 Q-62,-548 0,-542 Q62,-548 57,-478 Q50,-512 8,-514 Q-30,-512 -57,-478Z" fill="${c.hair}"/><path d="M-6,-541 q8,-22 22,-18 q-10,6 -8,18z" fill="${c.hair}"/>`;
  if(o.face) s+=`<g opacity="${o.faceOp==null?1:o.faceOp}">${face(o.face,o.sil)}</g>`;
  return s+'</g>';
}
const at=(x,y,sc,inner,extra='')=>`<g transform="translate(${x},${y}) scale(${sc}) ${extra}">${inner}</g>`;
// shadow on wall: feet at baseboard, bigger + skewed
const wallShadow=(x,o,col=SH_NIGHT,op=1)=>`<g opacity="${op}" transform="translate(${x},988) scale(1.28) skewX(-7)">${fig({...o,sil:col})}</g>`;

// ---------- rooms ----------
const MODES={
 night:{wall:'#2a3358',floor:'#1b2140',base:'#202848',wood:'#3f3346',woodD:'#30283a',sky:'#16203f',frame:'#3c4672',moon:true,beam:'rgba(190,210,255,0.09)',curtain:'#4a3a64',lamp:'#56607f'},
 bright:{wall:'#efe0c2',floor:'#b98d65',base:'#d7c3a0',wood:'#8b5e3c',woodD:'#6f4a2f',sky:'#0f1730',frame:'#d8c6a2',moon:false,beam:null,curtain:'#a0566a',lamp:'#fff3b0'},
 morning:{wall:'#d3dbe8',floor:'#a2acbf',base:'#bcc6d6',wood:'#8b6b4f',woodD:'#6c523c',sky:'#bfe3ff',frame:'#f1f4f8',moon:false,beam:'rgba(255,238,190,0.28)',curtain:'#7c8fb8',lamp:'#c9cfdb'},
};
function room(mode,o={}){
  const m=MODES[mode];
  let s=`<rect x="-200" y="-200" width="1120" height="1190" fill="${m.wall}"/>`;
  s+=`<rect x="-200" y="990" width="1120" height="500" fill="${m.floor}"/><rect x="-200" y="972" width="1120" height="20" fill="${m.base}"/>`;
  // window
  s+=`<rect x="62" y="222" width="246" height="296" rx="6" fill="${m.frame}"/><rect x="76" y="236" width="218" height="268" fill="${m.sky}"/>`;
  if(m.moon) s+=`<circle cx="236" cy="300" r="30" fill="#f3efd2"/><circle cx="236" cy="300" r="52" fill="#f3efd2" opacity="0.12"/>`;
  if(mode==='morning') s+=`<circle cx="140" cy="300" r="40" fill="#fff6d6"/>`;
  s+=`<rect x="181" y="236" width="8" height="268" fill="${m.frame}"/><rect x="76" y="366" width="218" height="8" fill="${m.frame}"/>`;
  s+=`<rect x="34" y="200" width="40" height="350" fill="${m.curtain}"/><rect x="296" y="200" width="40" height="350" fill="${m.curtain}"/><rect x="20" y="192" width="330" height="10" rx="5" fill="${m.woodD}"/>`;
  // door or wardrobe
  if(o.door){
    const op=o.doorOpen||0;
    s+=`<rect x="510" y="550" width="176" height="440" fill="${m.woodD}"/><rect x="520" y="560" width="156" height="430" fill="#0a0c18"/>`;
    const w=156*(1-op*0.85);
    s+=`<rect x="520" y="560" width="${w}" height="430" fill="${m.wood}"/>`;
    if(op<0.5) s+=`<circle cx="${520+w-22}" cy="780" r="9" fill="#d9b55a"/>`;
  } else if(!o.noWardrobe){
    s+=`<rect x="508" y="470" width="196" height="520" rx="6" fill="${m.wood}"/><rect x="604" y="480" width="4" height="500" fill="${m.woodD}"/>
        <rect x="586" y="700" width="8" height="40" rx="4" fill="#d9b55a"/><rect x="618" y="700" width="8" height="40" rx="4" fill="#d9b55a"/>`;
  }
  if(o.frames) s+=`<rect x="380" y="300" width="90" height="110" fill="${m.woodD}"/><rect x="390" y="310" width="70" height="90" fill="${m.sky}"/>
       <rect x="560" y="320" width="110" height="80" fill="${m.woodD}"/><rect x="570" y="330" width="90" height="60" fill="${m.frame}"/>`;
  // switch
  s+=`<rect x="462" y="630" width="26" height="40" rx="4" fill="${m.base}" stroke="${m.woodD}" stroke-width="2"/><rect x="471" y="640" width="8" height="12" fill="${m.woodD}"/>`;
  // lamp
  s+=`<rect x="358" y="-200" width="4" height="290" fill="${m.woodD}"/><path d="M320,120 L340,86 L380,86 L400,120Z" fill="${m.woodD}"/>`;
  const lampOn=mode==='bright';
  if(lampOn) s+=`<circle cx="360" cy="128" r="120" fill="#fff3b0" opacity="0.22"/>`;
  s+=`<circle cx="360" cy="126" r="16" fill="${m.lamp}"/>`;
  if(m.beam) s+=`<polygon points="76,236 294,236 ${mode==='morning'?'560,1280 140,1280':'620,1280 230,1280'}" fill="${m.beam}"/>`;
  return s;
}
const vignette=(k=0.7)=>`<defs><radialGradient id="vg" cx="50%" cy="48%" r="70%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="${k}"/></radialGradient></defs><rect width="720" height="1280" fill="url(#vg)"/>`;
const cam=(cx,cy,z,inner,shx=0,shy=0)=>`<g transform="translate(${360+shx},${640+shy}) scale(${z}) translate(${-cx},${-cy})">${inner}</g>`;
const shake=(t,a)=>[Math.sin(t*61)*a,Math.cos(t*47)*a];

// big head close-up
function closeHead(kind,look=0){
  let f=fig({face:kind});
  return f;
}

// ---------- EP2 props ----------
const BED={night:{wood:'#3f3346',woodD:'#2c2436',mat:'#7d88ad',pil:'#9aa4c6',blank:'#4c5a8f',gap:'#04050b'},
           morning:{wood:'#8b6b4f',woodD:'#6c523c',mat:'#e4e8f1',pil:'#f4f6fa',blank:'#7f93c9',gap:'#262b3b'}};
function bed(mode){
  const b=BED[mode];
  return `<rect x="20" y="630" width="36" height="390" rx="14" fill="${b.woodD}"/>
   <rect x="54" y="912" width="404" height="92" fill="${b.gap}"/>
   <rect x="40" y="910" width="24" height="100" fill="${b.woodD}"/><rect x="440" y="910" width="24" height="100" fill="${b.woodD}"/>
   <rect x="30" y="882" width="444" height="34" rx="6" fill="${b.wood}"/>
   <rect x="50" y="826" width="418" height="62" rx="16" fill="${b.mat}"/>
   <ellipse cx="112" cy="812" rx="62" ry="26" fill="${b.pil}"/>`;
}
const blanket=mode=>`<path d="M140,812 Q300,792 472,820 L472,892 L140,892Z" fill="${BED[mode].blank}"/><path d="M160,840 Q300,826 460,846" stroke="rgba(0,0,0,0.15)" stroke-width="5" fill="none"/>`;
// pale hand gripping the mattress edge; hy = knuckle height
function hand(hx,hy,grip){
  const f=grip; // 0..1 fingers curl over the edge
  let s=`<rect x="${hx-13}" y="${hy+20}" width="26" height="${1010-hy}" rx="12" fill="#cfd4df"/>`;
  s+=`<ellipse cx="${hx}" cy="${hy+18}" rx="26" ry="30" fill="#d9dde6"/>`;
  [-18,-6,6,18].forEach((dx,i)=>{const L=58+(i===1||i===2?8:0);
    s+=`<path d="M${hx+dx},${hy+6} q${dx*0.3},${-L*(1-f*0.3)} ${dx*0.2+f*4},${-L+f*12}" stroke="#d9dde6" stroke-width="12" stroke-linecap="round" fill="none"/>
        <path d="M${hx+dx},${hy+6} q${dx*0.3},${-L*(1-f*0.3)} ${dx*0.2+f*4},${-L+f*12}" stroke="#8a90a3" stroke-width="1.5" fill="none" opacity="0.6"/>`;});
  s+=`<path d="M${hx-26},${hy+22} q-14,-14 -10,-34" stroke="#d9dde6" stroke-width="12" stroke-linecap="round" fill="none"/>`;
  return s;
}
const handprint=(x,y,s,r,c='rgba(225,228,238,0.55)')=>`<g transform="translate(${x},${y}) rotate(${r}) scale(${s})" fill="${c}"><ellipse cx="0" cy="0" rx="10" ry="12"/>
  <ellipse cx="-9" cy="-15" rx="3" ry="6"/><ellipse cx="-3" cy="-18" rx="3" ry="7"/><ellipse cx="3" cy="-18" rx="3" ry="7"/><ellipse cx="9" cy="-15" rx="3" ry="6"/><ellipse cx="13" cy="-2" rx="3" ry="5" transform="rotate(40 13 -2)"/></g>`;
let PRINTS=null;
function prints(){ if(PRINTS) return PRINTS; let s='',seed=7; const rnd=()=>((seed=seed*16807%2147483647)/2147483647);
  for(let i=0;i<34;i++) s+=handprint(70+rnd()*370,925+rnd()*120,0.7+rnd()*0.5,rnd()*360);
  return PRINTS=s; }
function knockFx(t,x,y,size=54){
  let s='';
  for(const k of TL.allKnocks){ const d=t-k; if(d>=0&&d<0.55){ const sc=1+d*0.8, op=1-d/0.55;
    s+=`<text x="${x+(Math.round(k*10)%3-1)*60}" y="${y-d*30}" text-anchor="middle" font-family="P" font-weight="700" font-size="${size}" fill="#ffd23f" stroke="#000" stroke-width="6" paint-order="stroke" opacity="${op}" transform="translate(0,0)" style="transform-origin:${x}px ${y}px;transform:scale(${sc})">ก๊อก</text>`; } }
  return s;
}
const knockShake=(t,a=6)=>{for(const k of TL.allKnocks){const d=t-k; if(d>=0&&d<0.18) return shake(t,a*(1-d/0.18));} return [0,0];};
const dim=a=>`<rect x="-500" y="-500" width="2000" height="2500" fill="#000" opacity="${a}"/>`;
const LEGCLIP='<defs><clipPath id="lc"><rect x="-300" y="-700" width="600" height="575"/></clipPath></defs>';
const person=(face,o={})=>LEGCLIP+at(o.x||230,1120,1,`<g clip-path="url(#lc)">${fig({face,...o})}</g>`);
const bedroom=(mode,face,o={})=>room(mode)+(o.noPerson?'':person(face,o))+bed(mode)+blanket(mode);

// ---------- EP3 props ----------
(()=>{const st=document.createElement('style');st.textContent='.m{color:#ffc2d4;font-style:italic;text-shadow:0 0 6px #000,0 3px 0 #000,0 -2px 0 #000,3px 0 0 #000,-3px 0 0 #000}.x{color:#fff;background:#d7263d;box-shadow:0 4px 0 #7a1020}';document.head.appendChild(st);})();
const SKIN=PAL.skin;
function doorLight(o={}){
  let s=`<polygon points="520,990 676,990 760,1090 440,1090" fill="rgba(255,205,120,0.16)"/><rect x="520" y="978" width="156" height="12" fill="#ffd27a"/>`;
  if(o.feet){ const fx=o.fx||0, op=o.feet;
    s+=`<g opacity="${op}"><rect x="${560+fx}" y="978" width="30" height="12" fill="#120c08"/><rect x="${612+fx}" y="978" width="30" height="12" fill="#120c08"/>
      <polygon points="${560+fx},990 ${590+fx},990 ${600+fx*1.3},1090 ${540+fx*1.3},1090" fill="rgba(0,0,0,0.5)"/>
      <polygon points="${612+fx},990 ${642+fx},990 ${670+fx*1.3},1090 ${610+fx*1.3},1090" fill="rgba(0,0,0,0.5)"/></g>`; }
  return s;
}
const roomD=(face,o={})=>room('night',{door:true,doorOpen:o.doorOpen||0})+doorLight(o)+(o.noPerson?'':person(face,o))+bed('night')+blanket('night')+(o.extra||'');
function closeFace(face,z,extra='',bg='#1e2546'){
  return cam(230,665,z,`<rect x="-500" y="-500" width="2000" height="2500" fill="${bg}"/><ellipse cx="160" cy="700" rx="190" ry="70" fill="#9aa4c6"/>`+person(face)+extra+blanket('night'));
}
const mouthHands=at(230,1120,1,`<circle cx="-20" cy="-436" r="26" fill="${SKIN}"/><circle cx="18" cy="-430" r="26" fill="${SKIN}"/>
  <path d="M-40,-446 h40 M-40,-434 h40 M0,-440 h38 M0,-428 h38" stroke="#c99a76" stroke-width="3"/>`);
function heartOverlay(t,t0,period,k=0.45){
  const beat=Math.pow(Math.max(0,Math.sin((t-t0)*Math.PI/period)),8);
  return `<defs><radialGradient id="hb" cx="50%" cy="50%" r="70%"><stop offset="40%" stop-color="#ff0000" stop-opacity="0"/><stop offset="100%" stop-color="#b00000" stop-opacity="${0.12+beat*k}"/></radialGradient></defs><rect width="720" height="1280" fill="url(#hb)"/>`;
}
function knob(angle){
  return `<rect width="720" height="1280" fill="#3f3346"/><rect x="60" y="0" width="600" height="1280" fill="#46394e"/>
   <rect x="250" y="330" width="220" height="440" rx="40" fill="#b8913f"/><rect x="262" y="342" width="196" height="416" rx="34" fill="#9a7531"/>
   <circle cx="360" cy="480" r="118" fill="#d9b55a"/><circle cx="360" cy="480" r="96" fill="#e6c776"/>
   <g transform="rotate(${angle} 360 480)"><rect x="352" y="390" width="16" height="180" rx="8" fill="#b8913f"/><ellipse cx="320" cy="430" rx="34" ry="16" fill="#fff6d0" opacity="0.6" transform="rotate(-30 320 430)"/></g>
   <circle cx="360" cy="660" r="16" fill="#2a1d10"/><rect x="354" y="660" width="12" height="40" fill="#2a1d10"/>
   <rect x="0" y="1220" width="720" height="16" fill="#ffd27a" opacity="0.8"/>`;
}
const heart=(x,y,s)=>`<path transform="translate(${x},${y}) scale(${s})" d="M0,6 C-10,-6 -24,4 0,22 C24,4 10,-6 0,6Z" fill="#ff5b7f"/>`;
function phone(o){
  let s=`<rect width="720" height="1280" fill="#0a0d1c"/>
   <ellipse cx="360" cy="840" rx="250" ry="150" fill="${SKIN}"/>
   <rect x="180" y="110" width="360" height="700" rx="46" fill="#14151c"/><rect x="194" y="124" width="332" height="672" rx="36" fill="#0f1426"/>
   <rect x="320" y="136" width="80" height="18" rx="9" fill="#14151c"/>
   <text x="222" y="186" font-family="P" font-size="20" fill="#cfd6ea">23:01</text>`;
  if(o.ring){
    const pulse=(o.t*1.6)%1;
    s+=`<circle cx="360" cy="380" r="${70+pulse*70}" fill="none" stroke="#5ad17a" stroke-width="4" opacity="${1-pulse}"/>
      <circle cx="360" cy="380" r="70" fill="#2b3357"/><text x="360" y="402" text-anchor="middle" font-family="P" font-weight="700" font-size="60" fill="#fff">แม่</text>
      <text x="360" y="510" text-anchor="middle" font-family="P" font-weight="700" font-size="40" fill="#fff">แม่</text>${heart(410,488,1)}
      <text x="360" y="556" text-anchor="middle" font-family="P" font-size="26" fill="#aab3d0">กำลังโทรเข้า…</text>
      <circle cx="270" cy="700" r="40" fill="#e0384f"/><circle cx="450" cy="700" r="40" fill="#35c15e"/>
      <rect x="250" y="696" width="40" height="8" rx="4" fill="#fff"/><path d="M438,690 q12,-14 24,0" stroke="#fff" stroke-width="7" fill="none"/>`;
  } else {
    s+=`<rect x="194" y="200" width="332" height="70" fill="#151b33"/><circle cx="240" cy="235" r="22" fill="#2b3357"/><text x="240" y="244" text-anchor="middle" font-family="P" font-weight="700" font-size="20" fill="#fff">แม่</text>
      <text x="276" y="245" font-family="P" font-weight="700" font-size="28" fill="#fff">แม่</text>${heart(338,226,0.8)}`;
    (o.msgs||[]).forEach((m,i)=>{ const y=310+i*170, op=m.op==null?1:m.op, sc=0.85+0.15*op;
      s+=`<g opacity="${op}" transform="translate(214,${y}) scale(${sc})"><rect x="0" y="0" width="290" height="${40+m.lines.length*44}" rx="22" fill="${m.alert?'#3a1720':'#2a3150'}"/>`+
        m.lines.map((l,j)=>`<text x="20" y="${50+j*44}" font-family="P" font-weight="${m.alert?700:500}" font-size="28" fill="${m.alert?'#ff8a9b':'#eef1fb'}">${l}</text>`).join('')+
        `<text x="0" y="${70+m.lines.length*44}" font-family="P" font-size="18" fill="#6f7899">${m.time}</text></g>`; });
  }
  return s;
}
function momSil(){
  return `<path d="M-64,-470 Q-90,-300 -86,-150 L86,-150 Q90,-300 64,-470 Q0,-560 -64,-470Z" fill="#000"/>`+fig({sil:'#000',face:'sgrin'});
}
const MSG1={lines:['ยังอยู่ร้านป้าแดงนะลูก','เดี๋ยวกลับ'],time:'23:01'};
const MSG2={lines:['แม่ยังไม่ถึงบ้าน','ห้ามขานรับใครเด็ดขาด!!'],time:'23:06',alert:true};

// ---------- scenes ----------
function draw(sc,lt,p,t){
  let g='';
  switch(sc){
  case 1:{
    g=cam(lerp(360,320,ease(p)),lerp(700,760,ease(p)),lerp(1.0,1.15,ease(p)),roomD('calm'));
    const fi=1-seg(lt,0,0.8); if(fi>0) g+=`<rect width="720" height="1280" fill="#000" opacity="${fi}"/>`;
    break;}
  case 2:{ const [sx,sy]=shake(t,3); g=`<g transform="translate(${sx},${sy})">${closeFace('scared',lerp(4.4,5.0,ease(p)))}</g>`; break;}
  case 3: g=cam(lerp(320,420,ease(p)),760,1.15,roomD('calm')); break;
  case 4:{
    g=cam(lerp(420,600,ease(p)),lerp(760,820,ease(p)),lerp(1.15,1.8,ease(p)),roomD('calm'));
    if(lt>2.9) g+=heartOverlay(t,0,1.2,0.2);
    break;}
  case 5:{
    const buzz=lt>2.1;
    const [px,py]=buzz?shake(t,3):[0,0];
    const ph=`<g transform="translate(${380+px},${838+py}) rotate(-8)"><rect x="-26" y="-14" width="52" height="28" rx="6" fill="#14151c"/><rect x="-22" y="-10" width="44" height="20" rx="4" fill="${buzz?'#9fc2ff':'#1b2240'}"/></g>`+
      (buzz?`<circle cx="380" cy="838" r="70" fill="#9fc2ff" opacity="${0.18+0.1*Math.sin(t*30)}"/>`:'');
    g=cam(lerp(300,330,ease(p)),lerp(760,800,ease(p)),lerp(1.2,1.45,ease(p)),roomD(buzz?'scared':'calm',{extra:ph}));
    break;}
  case 6:{
    const [sx,sy]=lt<0.6?shake(t,6):[0,0];
    g=`<g transform="translate(${sx},${sy})">${phone({msgs:[{...MSG1,op:seg(lt,0.1,0.4)}]})}</g>`; break;}
  case 7:{ g=closeFace('scared',lerp(4.6,5.4,ease(p)))+heartOverlay(t,22.2,0.9,0.35); break;}
  case 8:{ g=cam(600,lerp(800,860,ease(p)),lerp(1.8,2.2,ease(p)),roomD('scared',{feet:0})); break;}
  case 9:{
    const step=Math.floor(lt/0.55), fx=lerp(-160,0,clamp(step/4));
    g=cam(600,lerp(900,960,ease(p)),lerp(2.3,2.9,ease(p)),roomD('scared',{feet:seg(lt,0.2,0.6),fx}))+heartOverlay(t,28,0.85,0.3);
    break;}
  case 10:{ const [sx,sy]=shake(t,2); g=`<g transform="translate(${sx},${sy})">${closeFace('scared',lerp(4.6,5.0,ease(p)),mouthHands,'#151a33')}</g>`; break;}
  case 11:{
    const a=lt<1.0?0:ease((lt-1.0)/2.8)*38+Math.sin(lt*23)*1.5*(lt>1?1:0);
    const [sx,sy]=shake(t,lt>1?2:0.5);
    g=`<g transform="translate(${sx},${sy})">${knob(a)}</g>`+heartOverlay(t,36,0.75,0.4); break;}
  case 12:{
    const [sx,sy]=lt<0.7?shake(t,7):[0,0];
    g=`<g transform="translate(${sx},${sy})">${phone({msgs:[MSG1,{...MSG2,op:seg(lt,1.3,1.6)}]})}</g>`+heartOverlay(t,40.5,0.75,0.3); break;}
  case 13:{
    g=cam(600,lerp(780,820,ease(p)),lerp(1.5,2.0,ease(p)),roomD('scared',{feet:1,fx:0})+dim(0.25))+heartOverlay(t,45.7,0.7,0.35); break;}
  case 14:{
    if(lt<1.4){ g=cam(600,820,2.0,roomD('scared',{feet:1})+dim(0.3)); break; }
    const [sx,sy]=shake(t,9);
    g=`<g transform="translate(${sx},${sy})">${phone({ring:true,t})}</g>`+
      `<rect width="720" height="1280" fill="#5ad17a" opacity="${0.06+0.06*Math.sin(t*20)}"/>`; break;}
  case 15:{
    if(lt>1.25){ g=`<rect width="720" height="1280" fill="#000"/>`; break; }
    const open=seg(lt,0,0.18), lunge=seg(lt,0.2,1.15);
    const inner=room('night',{door:true,doorOpen:open})+`<rect x="520" y="560" width="${156*open*0.85}" height="430" fill="#ffd27a" opacity="${open}"/>`+
      person('scared')+bed('night')+blanket('night');
    const [sx,sy]=shake(t,lt>0.2?10:0);
    g=cam(lerp(600,600,lunge),lerp(780,560,lunge),lerp(1.4,2.6,lunge),inner+
       `<g opacity="${seg(lt,0.12,0.25)}">${at(lerp(600,560,lunge),lerp(990,1500,lunge),lerp(0.85,3.4,lunge),momSil())}</g>`,sx,sy);
    if(lt>1.12) g+=`<rect width="720" height="1280" fill="#fff" opacity="${1-seg(lt,1.12,1.25)}"/>`;
    break;}
  }
  return g+vignette(0.7);
}

function endCard(lt){
  const a=seg(lt,0,0.6)*(1-seg(lt,2.2,2.6)), b=seg(lt,2.75,3.25);
  return `<div style="opacity:${a};position:absolute;top:520px;width:100%">
      <div style="color:#ff6b8a;font-size:30px;font-weight:700">ตอนต่อไป</div>
      <div style="font-size:60px;font-weight:700;line-height:1.25;margin-top:6px">กระจกที่<br>ไม่ยอมกะพริบตา</div>
      <div style="color:#8f9bc4;font-size:24px;margin-top:14px">เรื่องเล่าขนลุก · EP4</div></div>
    <div style="opacity:${b};position:absolute;top:560px;width:100%">
      <div style="color:#c7cfe8;font-size:30px">ติดตามตอนต่อไป</div>
      <div style="font-size:66px;font-weight:700;margin-top:4px">${CHANNEL}</div></div>`;
}

function render(t){
  const sc=TL.scenes.find(s=>t>=s.start&&t<s.end)||TL.scenes[TL.scenes.length-1];
  const lt=t-sc.start, p=lt/(sc.end-sc.start);
  const svg=document.getElementById('stage'), end=document.getElementById('end'), sub=document.getElementById('sub');
  if(sc.scene===99){
    svg.innerHTML=`<rect width="720" height="1280" fill="#1f2747"/>`+vignette(0.6);
    end.style.display='block'; end.innerHTML=endCard(lt);
  } else { end.style.display='none'; svg.innerHTML=draw(sc.scene,lt,p,t); }
  let cur=null;
  TL.chunks.forEach((c,i)=>{const nx=TL.chunks[i+1]; const until=Math.min(c.end+0.6,nx?nx.start:1e9); if(t>=c.start-0.05&&t<until) cur=c;});
  if(cur&&cur.style!=='k'){
    const k=clamp((t-cur.start+0.05)/0.12), sc2=0.85+0.15*k;
    const [sx,sy]=cur.style==='x'?shake(t,6):[0,0];
    const txt=cur.style==='m'?`“${cur.text}”`:cur.text;
    sub.innerHTML=`<span class="${cur.style}" style="white-space:nowrap;transform:translate(${sx}px,${sy}px) scale(${sc2})">${txt}</span>`;
    const sp=sub.firstChild; let fs=46; while(sp.offsetWidth>640&&fs>36){fs-=2; sp.style.fontSize=fs+'px';}
    if(sp.offsetWidth>640){ // break at the space nearest the middle
      const sps=[...txt.matchAll(/ /g)].map(m=>m.index); const mid=txt.length/2;
      const at_=sps.sort((x,y)=>Math.abs(x-mid)-Math.abs(y-mid))[0];
      if(at_!=null){sp.innerHTML=txt.slice(0,at_)+'<br>'+txt.slice(at_+1); sp.style.fontSize='44px'; sp.style.lineHeight='1.3';}}
  } else sub.innerHTML='';
}
window.setup=tl=>{TL=tl; TL.allKnocks=TL.allKnocks||[];};
window.render=render;
</script></body></html>
